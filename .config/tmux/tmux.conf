#--------------------------------------------------------------------------
# Plugins
#--------------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-window-name must load before tmux-resurrect: it registers the
# @resurrect-hook-{pre,post}-restore-all hooks that suspend its own rename hook
# while panes are being restored. resurrect must in turn load before continuum,
# which reads @resurrect-restore-script-path to kick off the auto-restore.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

#--------------------------------------------------------------------------
# Key Bindings
# - r means that the bind can repeat without entering prefix again
# - n means that the bind doesn't use the prefix
#--------------------------------------------------------------------------

set -g extended-keys on
set -g extended-keys-format csi-u

set -g prefix C-t

# PREFIX r to reload of the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf\; display-message '~/.config/tmux/tmux.conf reloaded'

# PREFIX + Right to split the window horizontally and use cwd
bind Right split-window -h -c "#{pane_current_path}"
# PREFIX + Down to split the window vertically and use cwd
bind Down split-window -v -c "#{pane_current_path}"

# Navigate panes with PREFIX h,j,k,l
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Rotate panes with PREFIX > and PREFIX <
bind -r > rotate-window -U
bind -r < rotate-window -D

#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

# Use Vi mode
setw -g mode-keys vi

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# tmux-window-name owns window names; ignore rename escape sequences from apps.
set -g allow-rename off

# Renumber windows when one is removed.
set -g renumber-windows on

# Advertise the capabilities Alacritty provides to tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ',alacritty:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:mouse:strikethrough:sync:title:usstyle'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

#--------------------------------------------------------------------------
# Status line
#--------------------------------------------------------------------------

# Status line customisation
set-option -g status-left-length 100
set-option -g status-right-length 100

set-option -g status-left " #{session_name}  "
# set-option -g status-left " " # Screencast mode

set-option -g status-right "#{pane_title} "
# set-option -g status-right "#[fg=#1D9BF0]#[fg=#c0caf5] @jessarchercodes   #[fg=#ffffff] #[fg=#c0caf5]jessarcher   #[fg=#06B6D4]爵#[fg=#94A3B8]jessarcher.com "
# set-option -g status-right "#[fg=#1D9BF0]#[fg=#c0caf5] jessarchercodes   #[fg=#ffffff] #[fg=#c0caf5]jessarcher "

set-option -g status-style "fg=#545c7e bg=#1f2335"
#set-option -g status-style "fg=#545c7e bg=default" # Screencast mode

# Agent extensions set window options because runtimes such as Node hide the
# harness name from pane_current_command. The gold state persists until the next
# prompt, so completion stays visible even when another window has focus.
set-option -g window-status-format "#{?#{==:#{@llm_agent_waiting},1},#[fg=#1f2335#,bg=#e0af68#,bold],#[fg=#545c7e#,bg=#1f2335#,nobold]}#{window_index}/#{?#{@llm_agent_name},#{@llm_agent_name},#{pane_current_command}}#[fg=#545c7e,bg=#1f2335,nobold] "
set-option -g window-status-current-format "#{?#{==:#{@llm_agent_waiting},1},#[fg=#1f2335#,bg=#e0af68#,bold],#[fg=#545c7e#,bg=#1f2335#,nobold]}#{window_index}/#{?#{==:#{@llm_agent_waiting},1},,#[fg=#E9E9EA]}#{?#{@llm_agent_name},#{@llm_agent_name},#{pane_current_command}}#[fg=#545c7e,bg=#1f2335,nobold] "
# set-option -g window-status-format "· " # Screencast mode
# set-option -g window-status-current-format "· " # Screencast mode

set-option -g window-status-current-style "fg=#E9E9EA"
set-option -g window-status-activity-style none

set-option -g pane-active-border-style "fg=#1f2335"
set-option -g pane-border-style "fg=#1f2335"

set-option -sg escape-time 10

#--------------------------------------------------------------------------
# Session persistence
#--------------------------------------------------------------------------

# Restoring is a re-exec, not a process checkpoint: resurrect saves each pane's
# argv and types it back into a fresh shell. No in-memory state survives, only
# what a program can rebuild from disk on its own.

# Keep the visible scrollback alongside the layout, so a pane still reads
# correctly even when the program that filled it comes back empty.
set -g @resurrect-capture-pane-contents 'on'

# Added to resurrect's built-in list rather than replacing it, so the defaults
# (nvim, less, man, top, ...) still apply.
#
# The match runs against `ps -o args`, never the process name -- which is what
# makes bare `claude` work here: ~/.local/bin/claude is a symlink into
# versions/2.1.x, so tmux reports the pane command as "2.1.261" while argv[0]
# stays "claude". The whole argv is replayed verbatim, so a pane started as
# `claude --resume <uuid>` reopens that exact conversation; the transcript is a
# file under ~/.claude/projects/ and outlives the reboot. A pane started as
# plain `claude` can only return as a new empty session -- the id was never in
# argv to be saved.
set -g @resurrect-processes 'claude'

# Restore the saved environment when the tmux server next starts. Auto-save runs
# on continuum's default 15 minute interval. Escape hatch: `touch
# ~/tmux_no_auto_restore` suppresses the restore without editing this file.
set -g @continuum-restore 'on'

# Pinned off, not merely left default: switching this on installs a launchd
# agent that opens a terminal and starts tmux at login. Starting tmux stays a
# deliberate, manual act.
set -g @continuum-boot 'off'

#--------------------------------------------------------------------------
# Don't touch these
#--------------------------------------------------------------------------

# Hooks run via run-shell inherit the tmux server's PATH, not an interactive
# shell's, so pyenv's shims are missing there and `python3` falls through to
# homebrew's interpreter, which has no libtmux -- tmux-window-name then dies on
# every window switch. Prepend the shims so hooks resolve the same interpreter
# an interactive shell would. Guarded so PREFIX r doesn't stack duplicates.
run-shell 'case ":$PATH:" in *":$HOME/.pyenv/shims:"*) ;; *) tmux set-environment -g PATH "$HOME/.pyenv/shims:$PATH" ;; esac'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
